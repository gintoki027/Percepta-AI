<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description"
        content="Blind Helper — AI-powered navigation assistant using camera, object detection, and scene description.">
    <meta name="theme-color" content="#0a0a1a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Blind Helper</title>

    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- ─── Splash / Loading ─────────────────────────────── -->
    <div id="splash-screen" class="splash-screen">
        <div class="splash-content">
            <div class="splash-icon">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3" />
                    <path d="M12 2a10 10 0 0 1 10 10" />
                    <path d="M12 2a10 10 0 0 0-10 10" />
                    <path d="M12 22a10 10 0 0 0 10-10" />
                    <path d="M12 22a10 10 0 0 1-10-10" />
                </svg>
            </div>
            <h1>Blind Helper</h1>
            <p class="splash-subtitle">AI Navigation Assistant</p>
            <div class="loading-bar">
                <div class="loading-fill" id="loading-fill"></div>
            </div>
            <p class="loading-text" id="loading-text">Initializing...</p>
        </div>
    </div>

    <!-- ─── Main App ─────────────────────────────────────── -->
    <div id="app" class="app hidden">
        <!-- Camera View -->
        <div class="camera-container" id="camera-container">
            <video id="camera-feed" autoplay playsinline muted></video>
            <canvas id="overlay-canvas"></canvas>

            <!-- Status Bar (top) -->
            <div class="status-bar">
                <div class="status-indicator" id="status-indicator">
                    <span class="status-dot"></span>
                    <span class="status-text" id="status-text">Ready</span>
                </div>
                <div class="status-fps" id="status-fps">-- ms</div>
            </div>

            <!-- Alert Banner -->
            <div class="alert-banner hidden" id="alert-banner">
                <span class="alert-icon">⚠️</span>
                <span class="alert-text" id="alert-text"></span>
            </div>

            <!-- Detection Messages -->
            <div class="message-feed" id="message-feed"></div>
        </div>

        <!-- Bottom Controls -->
        <div class="controls-panel" id="controls-panel">
            <!-- Main Action Button -->
            <button class="btn-main" id="btn-toggle" aria-label="Start or stop camera">
                <svg class="icon-play" id="icon-play" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5,3 19,12 5,21" />
                </svg>
                <svg class="icon-stop hidden" id="icon-stop" width="32" height="32" viewBox="0 0 24 24"
                    fill="currentColor">
                    <rect x="4" y="4" width="16" height="16" rx="2" />
                </svg>
            </button>

            <!-- Secondary Controls -->
            <div class="controls-row">
                <button class="btn-secondary" id="btn-describe" aria-label="Describe full scene" disabled>
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9" />
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
                    </svg>
                    <span>Describe Scene</span>
                </button>

                <button class="btn-secondary" id="btn-read-signs" aria-label="Read nearby signs" disabled>
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                        <line x1="7" y1="8" x2="17" y2="8" />
                        <line x1="7" y1="12" x2="17" y2="12" />
                        <line x1="7" y1="16" x2="13" y2="16" />
                    </svg>
                    <span>Read Signs</span>
                </button>

                <button class="btn-secondary" id="btn-mute" aria-label="Mute or unmute audio">
                    <svg class="icon-unmuted" width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11,5 6,9 2,9 2,15 6,15 11,19" />
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                    </svg>
                    <svg class="icon-muted hidden" width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11,5 6,9 2,9 2,15 6,15 11,19" />
                        <line x1="23" y1="9" x2="17" y2="15" />
                        <line x1="17" y1="9" x2="23" y2="15" />
                    </svg>
                    <span>Sound</span>
                </button>

                <button class="btn-secondary" id="btn-find-object" aria-label="Find specific object" disabled>
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <span>Find Object</span>
                </button>

                <button class="btn-secondary" id="btn-settings" aria-label="Settings">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                    </svg>
                    <span>Settings</span>
                </button>
            </div>
        </div>

        <!-- Settings Modal -->
        <div class="modal-overlay hidden" id="settings-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Settings</h2>
                    <button class="btn-close" id="btn-close-settings" aria-label="Close settings">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="setting-group">
                        <label for="server-url">Server URL</label>
                        <input type="url" id="server-url" placeholder="ws://localhost:8000" value="">
                        <p class="setting-hint">WebSocket server address</p>
                    </div>
                    <div class="setting-group">
                        <label for="fps-slider">Frame Rate: <span id="fps-value">2</span> FPS</label>
                        <input type="range" id="fps-slider" min="1" max="5" value="2" step="1">
                        <p class="setting-hint">Higher = more responsive, more server load</p>
                    </div>
                    <div class="setting-group">
                        <label for="speech-rate">Speech Speed: <span id="speech-rate-value">1.0</span>x</label>
                        <input type="range" id="speech-rate" min="0.5" max="2.0" value="1.0" step="0.1">
                    </div>
                    <div class="setting-group">
                        <label for="show-overlay">
                            <input type="checkbox" id="show-overlay" checked>
                            Show detection overlay
                        </label>
                    </div>
                    <div class="setting-group">
                        <label for="haptic-enabled">
                            <input type="checkbox" id="haptic-enabled" checked>
                            Haptic feedback for close objects
                        </label>
                    </div>
                    <div class="setting-group">
                        <label for="vlm-interval">VLM Interval: <span id="vlm-interval-value">10</span>s</label>
                        <input type="range" id="vlm-interval" min="5" max="30" value="10" step="5">
                        <p class="setting-hint">How often to request full scene description</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Screen reader announcements -->
    <div id="sr-announcements" class="sr-only" aria-live="assertive" role="alert"></div>

    <script src="js/app.js"></script>
</body>

</html>
